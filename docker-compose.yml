version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: gcp-back-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: gcp_dev_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:alpine
    container_name: gcp-back-redis
    restart: always
    ports:
      - '6379:6379'
volumes:
  pgdata:
